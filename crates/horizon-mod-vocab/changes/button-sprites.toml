ids = ["method:DrawContext::widget_button", "type:ButtonSprites"]
why = "a mod could draw its own button with sprite() but lost everything widget_button does for it: the narration record and the controller's focus happen inside the host, so 226 of MineColonies' 271 buttons (in 71 of 78 XML files, each carrying source=... from its own pack) would have been redrawn by hand without narration. One optional ButtonSprites on the existing call gives the mod its three states and a label offset while the label, its scrolling, the grey inactive colour, the narration record and the focus stay the host's."
migrate = "A mod that calls DrawContext::widget_button passes None as the new last argument and keeps the game's sprite exactly as today. A mod that wants its own art builds ButtonSprites::new(\"mymod:button/normal\") with with_highlighted / with_disabled / with_label_offset and passes it: a missing highlighted or disabled falls back to normal, and an unknown normal falls back to the game's sprite. Rebuild native and wasm mods against the updated SDK; Widgets::button keeps drawing the game's sprite."
